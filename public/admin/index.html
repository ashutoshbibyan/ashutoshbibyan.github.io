<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Content Manager</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // This helper "pings" the popup to say "I am ready for the token"
    setInterval(() => {
      const popup = window.open('', 'netlify-cms-auth');
      if (popup && !popup.closed) {
        popup.postMessage("authorizing:github", "*");
      }
    }, 1000);
  </script>
</body>
</html>
